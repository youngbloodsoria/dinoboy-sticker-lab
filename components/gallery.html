<!-- Product media gallery snippet. Product pages currently render this from js/productsData.js. -->
<div class="product-media">
  <p class="breadcrumb">Shop &gt; Brighton Shoes</p>
  <div class="thumbs" aria-label="Product thumbnails"></div>
  <figure class="main-product-image">
    <img id="mainProductImage" src="assets/shop/dinoboy-shoe-5.jpg" alt="Brighton hand-painted shoes" />
  </figure>
  <figure class="process-video">
    <button class="video-launch" type="button" data-video="assets/shop/dinoboy-shoe-video.mp4" aria-label="Open hand-painting process video">
      <video muted playsinline preload="metadata" poster="assets/shop/dinoboy-shoe-1.jpg">
        <source src="assets/shop/dinoboy-shoe-video.mp4" type="video/mp4" />
      </video>
      <span class="play-badge">▶</span>
    </button>
    <figcaption>Watch the hand-painting process ↗</figcaption>
  </figure>
</div>
